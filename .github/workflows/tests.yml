name: Python Tests

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest 

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r requirements.txt

    - name: Run pytest
      run: |
        pytest src/tests
